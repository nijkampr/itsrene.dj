name: sync-sets

# Keeps data/sets.json + data/stats.json honest without a human (ADR-0004).
# Curated fields always win; new uploads land with vibe=null for curation.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC — off the :00 rush
  workflow_dispatch:

permissions:
  contents: write
  actions: write # keepalive step below

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync from SoundCloud RSS + decapi
        id: sync
        run: |
          result=$(python3 scripts/sync_sets.py)
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Commit if changed
        if: steps.sync.outputs.result == 'CHANGED'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sets.json data/stats.json
          git commit -m "data: weekly sync from SoundCloud RSS + Twitch stats"
          git push

      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Weeks with no new sets mean no commits, so re-enable this workflow on
      # every run; that resets the inactivity timer without a dummy commit.
      - name: Keepalive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync-sets.yml/enable"
